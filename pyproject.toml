[project]
name = "unergy-operaciones-backend"
version = "0.1.0"
description = "Backend Django + DRF de la plataforma de Operaciones de Unergy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2",
    "alembic>=1.13.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "apscheduler>=3.10.0",
    "pytz",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "google-api-python-client>=2.120.0",
    "google-auth>=2.29.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "django>=6.0.8",
    "djangorestframework>=3.18.0",
    "django-cors-headers>=4.9.0",
    "celery[redis]>=5.6.3",
    "django-celery-beat>=2.9.0",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.13.1",
    "django-types>=0.22.0",
    "djangorestframework-types>=0.9.0",
]

[tool.uv]
# El repo no es un paquete instalable: la app corre desde el codigo fuente
# (`gunicorn config.wsgi:application` con working_dir en la raiz). Sin esto, uv
# intentaria construir un wheel y setuptools se atoraria con los ~10 directorios
# de la raiz.
package = false

[tool.pyright]
# Mismo perfil que el backend de plataforma: los stubs de django-types resuelven
# `Model.objects`, `DoesNotExist` y demas atributos que Django crea en runtime;
# lo que el analizador aun no puede inferir se silencia en vez de inundar el editor.
typeCheckingMode = "basic"
reportUninitializedInstanceVariable = "none"
reportGeneralTypeIssues = "none"
reportAttributeAccessIssue = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportMissingTypeArgument = "none"

[tool.ruff.lint]
# Sin `select` explicito, ruff 0.16 habilita ~700 reglas por defecto y este repo
# reporta 4 254 hallazgos que nadie eligio. Fijamos el set clasico (pyflakes +
# los errores de pycodestyle) para que el lint sea el mismo en editor y en CI.
select = ["E4", "E7", "E9", "F"]
# Falsos positivos del idioma de los frameworks, si alguien amplia `select`:
#   RUF012 - `Meta.fields`, `unique_together`, `permission_classes` son listas de
#            clase a proposito; Django/DRF las leen al definir la clase.
#   B008   - `Depends(...)` / `Query(...)` en el default del parametro es como
#            FastAPI declara sus dependencias.
ignore = ["RUF012", "B008"]
