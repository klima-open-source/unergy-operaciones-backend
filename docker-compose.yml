x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: "${IMAGE}"
  platform: linux/amd64
  init: true                              # PID 1 que reapea los `soffice --headless`
  restart: unless-stopped
  env_file: .env
  working_dir: /app                       # el Dockerfile usa WORKDIR /app
  volumes:
    - .:/app                              # codigo sincronizado: `git pull` + restart, sin rebuild
    - ./uploads:/app/uploads              # STORAGE_LOCAL_PATH
    - ../logs:/home/app/logs
  # OJO: `<<: *app-base` no hace merge profundo. Si un servicio declara su propio
  # `environment`, reemplaza este bloque entero — por eso las variables comunes
  # viven aca y ningun servicio las redeclara.
  environment:
    PYTHONUNBUFFERED: 1
    PYTHONDONTWRITEBYTECODE: 1            # sin .pyc root-owned dentro del repo montado
    TZ: UTC                               # el codigo asume UTC (hoy_col())
    DJANGO_SETTINGS_MODULE: config.settings
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - operaciones_network

services:
  # Broker de Celery. Sin persistencia a proposito: el horario vive en Postgres
  # (django_celery_beat) y las tareas son idempotentes, asi que una cola perdida
  # en un reinicio se recupera sola en la franja siguiente. Guardar el AOF seria
  # complejidad para proteger algo que no hace falta proteger.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - operaciones_network

  # One-shot: crea/actualiza el esquema y termina. Sin `||`: si falla, sale con
  # codigo != 0 y nada mas arranca. El ultimo paso compara los modelos contra la
  # base y convierte "columna del modelo sin migracion" en un deploy que falla,
  # en vez de un 500 semanas despues.
  #
  # `manage.py migrate` reemplazo a `alembic upgrade head` el 2026-09-04: Django
  # posee el esquema desde entonces y Alembic quedo congelado en la revision 143
  # (su historial se conserva como bitacora, ya no se ejecuta).
  #
  # `--fake-initial` es lo que permite adoptar una base que YA tiene las 119
  # tablas: marca aplicada cada migracion `initial` cuyas tablas existen, en vez
  # de intentar crearlas y morir con "relation already exists". Sin el, el primer
  # deploy contra produccion falla en el primer CREATE TABLE.
  #
  # ⚠️ QUITAR `--fake-initial` DESPUES DEL PRIMER DEPLOY. Sirve exactamente una
  # vez: adoptar una base que ya tiene las tablas. Dejarlo puesto cambia un fallo
  # ruidoso por uno callado -- si algun dia una migracion `initial` nueva choca
  # con una tabla que ya existe, con el flag Django la marca aplicada SIN crear
  # nada y el modelo queda sin sus columnas, en silencio; sin el flag revienta
  # con "relation already exists" en el deploy, que es donde uno quiere enterarse.
  #
  # Antes de quitarlo, confirmar que la adopcion quedo registrada:
  #     docker compose exec operaciones python manage.py showmigrations | grep -c "\[X\]"
  # Tiene que dar 29 o mas.
  #
  # Para adoptar OTRA base ya poblada (montar un staging desde un dump), el flag
  # se pasa a mano esa vez, sin tocar este archivo:
  #     docker compose run --rm operaciones python manage.py migrate --fake-initial
  migrate:
    <<: *app-base
    restart: "no"
    command: >
      sh -c "python manage.py migrate --fake-initial --no-input &&
      python manage.py showmigrations --plan | tail -5 &&
      python scripts/verificar_esquema_django.py &&
      python manage.py collectstatic --no-input"

  operaciones:
    <<: *app-base
    depends_on:
      migrate:
        condition: service_completed_successfully
    # gunicorn y no uvicorn: las vistas de DRF son sincronas, y bajo ASGI Django
    # las corre con `thread_sensitive=True`, que las serializa en un solo hilo.
    # Con workers sincronos cada peticion tiene su proceso, que es el modelo para
    # el que estan escritas.
    #
    # WORKERS ya NO tiene que ser 1. Lo era porque el BackgroundScheduler vivia
    # dentro del proceso web y cada worker arrancaba el suyo, duplicando los
    # jobs; ahora eso es el servicio `worker` y la restriccion desaparecio.
    # El timeout es alto porque hay endpoints que arman Excel con LibreOffice.
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:${PORT:-8000}
      --workers ${WORKERS:-3}
      --timeout 120
      --access-logfile -
      --forwarded-allow-ips '*'
    # PORT del .env manda en los tres lados: gunicorn, el puerto publicado y el
    # healthcheck. Mismo numero dentro y fuera para no tener que recordar dos.
    # Con proxy en el host: "127.0.0.1:${PORT:-8000}:…".
    expose:
      - "${PORT:-8000}"
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    healthcheck:
      # $$PORT lo expande el shell del contenedor, no docker compose.
      test:
        [
          "CMD-SHELL",
          'python -c "import socket; s=socket.socket(); s.settimeout(2); s.connect((''localhost'',$${PORT:-8000})); s.close()"',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s                   # las migraciones ya corrieron en `migrate`
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ⚠️ `--concurrency=1` NO es provisional. Dos tareas guardan estado en memoria
  # del proceso y las dos fallan CALLADO si se reparten entre workers:
  #
  #   · monitoreo.sondeo_mgs — el AlarmEngine recuerda entre ciclos que alarmas
  #     estan activas, y de ahi sale cuales se superaron. Repartido, las alarmas
  #     se siguen creando pero dejan de cerrarse y el conteo de "activas" solo
  #     crece (es el bug que se arreglo en la auditoria del 2026-08-31).
  #   · mandatos.revisar_correos — la bandera `ingesta_en_curso` evita que dos
  #     corridas tomen el mismo correo y DUPLIQUEN la subida del PDF a Drive, que
  #     es lo unico aca que no se deshace sin trabajo manual archivo por archivo.
  #
  # Para subir la concurrencia hay que sacar esos dos estados a Redis primero, o
  # mandar esas dos tareas a su propia cola de un solo worker.
  worker:
    <<: *app-base
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info --concurrency=1
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # UN SOLO beat en todo el despliegue: cada replica dispararia la misma franja,
  # y el reporte de energia de las 3:30am correria dos veces.
  #
  # `DatabaseScheduler` guarda el horario en Postgres y lo sincroniza desde
  # `config/horarios.py` al arrancar: el codigo es la fuente de verdad y la tabla
  # su reflejo. Por eso depende de `migrate` — sin sus tablas no levanta.
  beat:
    <<: *app-base
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: celery -A config beat --loglevel=info
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  operaciones_network:
    driver: bridge
