name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      migrar:
        description: "auto = solo si cambio el esquema; siempre = correr migrate igual"
        type: choice
        options: [auto, siempre]
        default: auto

# El deploy toca un directorio compartido del servidor: dos corriendo a la vez se
# pisan el `git reset` y el `docker compose`. En cola, y sin cancelar el que va.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # La misma suite de tests.yml, llamada como reusable workflow para no tener dos
  # copias que se desincronicen. Corre en runner de GitHub, no en el servidor.
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    # Sin tests verdes no se despliega: ni el git pull ni el build ocurren.
    needs: test
    # `master` es la rama de produccion. La guarda es por workflow_dispatch: el
    # step despliega `github.ref_name`, asi que un dispatch con --ref otra-rama
    # publicaria esa rama en el servidor de produccion. El trigger de push ya
    # esta limitado, esto cubre el disparo a mano.
    if: github.ref == 'refs/heads/master'
    # Runner instalado en el servidor propio (nombre `operations`, etiqueta
    # `prod`). Se pide la etiqueta y no solo `self-hosted`: esa la tiene TODO
    # runner propio, asi que un segundo runner en este repo podria robarse el
    # job. No hay `checkout`: el repo ya vive en DEPLOY_DIR con su .env, sus
    # uploads y su historia git — de esa historia sale el diff que decide si
    # hay que migrar.
    runs-on: [self-hosted, prod]
    # `packages: read` es lo que le permite al GITHUB_TOKEN leer del registro de
    # contenedores; sin esto el login de abajo no sirve de nada.
    permissions:
      contents: read
      packages: read
    steps:
      # El Dockerfile trae el binario de uv de `ghcr.io/astral-sh/uv`. La imagen
      # es publica, asi que el pull anonimo deberia bastar -- y basto durante
      # meses. El 2026-09-17 empezo a fallar con `403 Forbidden` al pedir el
      # token, dos veces seguidas, tambien al reintentar el run.
      #
      # El pull anonimo es fragil por dos lados: lo tumba un limite de tasa del
      # registro, y lo tumba una credencial vieja guardada en el runner --si
      # alguien hizo `docker login ghcr.io` con un token que despues expiro,
      # Docker la sigue mandando y el registro responde 403 en vez de dejar
      # pasar como anonimo. Este runner es propio, asi que ese estado se queda.
      #
      # Autenticarse con el token que GitHub ya le da a cada corrida arregla los
      # dos casos: deja de depender del anonimo, y de paso PISA la credencial
      # vieja del runner, que no se puede borrar sin entrar por SSH.
      - name: Login en ghcr.io para el pull de uv
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # El .env del servidor se REESCRIBE desde el secret ENV_FILE en cada
      # deploy: la configuracion se cambia en GitHub, no entrando por SSH.
      # Consecuencia: editarlo a mano en el servidor no sirve de nada, el
      # proximo deploy lo pisa. Un solo secret con el archivo entero (y no 60
      # sueltos) para que agregar una variable no obligue a tocar el workflow.
      #
      # El contenido del secret es el `.env.prod` local, que NO va al repo:
      #   gh secret set ENV_FILE < .env.prod
      - name: Escribir .env
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/originabot/unergy-operations/unergy-operaciones-backend' }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          umask 077                      # 600: solo el usuario del runner lo lee

          # Los tres guardas existen porque el modo de fallo es CARO: con un
          # .env vacio o truncado, la app arranca con los defaults de
          # app/core/config.py -> apunta a postgres:postgres@localhost y
          # `migrate` correria las migraciones contra lo que encuentre ahi.
          # Mejor abortar el deploy.
          if [ -z "${ENV_FILE:-}" ]; then
              echo "::error::falta el secret ENV_FILE. Crealo con: gh secret set ENV_FILE < .env.prod"
              exit 1
          fi
          printf '%s' "$ENV_FILE" > .env.nuevo
          for requerida in SECRET_KEY IMAGE; do
              grep -qE "^${requerida}=." .env.nuevo || {
                  echo "::error::ENV_FILE no trae ${requerida} con valor"; exit 1; }
          done
          grep -qE '^(DATABASE_URL=.|POSTGRES_DB=.)' .env.nuevo || {
              echo "::error::ENV_FILE no trae ni DATABASE_URL ni POSTGRES_DB"; exit 1; }

          # Copia del anterior antes de pisarlo: si el secret quedo mal, el
          # rollback es `cp .env.anterior .env` sin buscar el valor bueno.
          # Con `if` y no `[ -f .env ] && cp ...`: bajo `set -e`, ese && falla el
          # step entero la primera vez, cuando todavia no hay .env.
          if [ -f .env ]; then cp -p .env .env.anterior; fi
          mv .env.nuevo .env
          chmod 600 .env
          echo "$(grep -cE '^[A-Z]' .env) variables escritas en $DEPLOY_DIR/.env"

      - name: git pull + docker compose
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/originabot/unergy-operations/unergy-operaciones-backend' }}
          MIGRAR: ${{ inputs.migrar || 'auto' }}
          # La rama que disparo el workflow, no `master` fijo: asi cambiar el
          # trigger de arriba no deja el servidor desplegando otra rama.
          RAMA: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"

          antes=$(git rev-parse HEAD)
          git fetch --prune origin "$RAMA"
          git reset --hard "origin/$RAMA"
          despues=$(git rev-parse HEAD)
          cambios=$(git diff --name-only "$antes" "$despues")
          echo "$antes -> $despues"
          echo "$cambios" | sed 's/^/  /'

          # `apps/*/migrations/`: desde el 2026-09-04 Django posee el esquema y
          # Alembic quedo congelado en la revision 143 (su historial se conserva
          # como bitacora, ya no se ejecuta). Se sigue mirando `alembic/` por si
          # alguien toca esa carpeta -- deberia ser imposible, y si pasa es mejor
          # que dispare la migracion y falle a la vista.
          if echo "$cambios" | grep -qE '^(apps/[a-z_]+/migrations/|alembic/)'; then
              migrar=si; motivo="cambio el esquema"
          elif [ "$MIGRAR" = siempre ]; then
              migrar=si; motivo="pedido a mano"
          elif [ -z "$(docker compose ps -q operaciones)" ]; then
              # Arranque en frio: nunca se sabe en que revision quedo la base.
              migrar=si; motivo="el servicio no estaba arriba"
          else
              migrar=no; motivo="sin cambios de esquema"
          fi
          echo "migrar=$migrar ($motivo)"

          # Un solo build: los dos servicios usan la misma imagen.
          docker compose build

          if [ "$migrar" = si ]; then
              # `run --rm` y no `up`: falla -> este step falla y el contenedor
              # que esta sirviendo sigue con la version anterior.
              docker compose run --rm migrate
          fi

          # Los cuatro servicios de larga vida, no solo el web: `worker` corre los
          # 19 jobs programados y `beat` es quien los dispara. Levantar solo
          # `operaciones` deja la API sirviendo con el sondeo de MGS, las alertas
          # de vencimiento y el reporte de energia APAGADOS, sin ningun error.
          #
          # --no-deps para no volver a evaluar `migrate`: quien decide si corre es
          # el if de arriba, no el depends_on. `redis` no lo lleva porque es
          # dependencia de worker/beat y no del web.
          docker compose up -d redis
          docker compose up -d --no-deps operaciones worker beat

      - name: Esperar healthy
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/originabot/unergy-operations/unergy-operaciones-backend' }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # `docker inspect` y no `docker compose ps --format`: compose v2 solo
          # acepta table|json ahi, un template Go falla con "parsing failed".
          # El id se relee en cada vuelta porque un contenedor que se reinicia
          # cambia de id.
          for _ in $(seq 40); do
              cid=$(docker compose ps -q operaciones || true)
              if [ -n "$cid" ]; then
                  estado=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo sin-healthcheck)
                  echo "  estado: $estado"
                  if [ "$estado" = healthy ]; then echo "healthy"; exit 0; fi
              fi
              sleep 3
          done
          echo "no quedo healthy en 120s:"
          docker compose ps
          docker compose logs --tail 80 operaciones
          exit 1
